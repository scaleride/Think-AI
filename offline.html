<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comet is offline</title>
    <meta name="theme-color" content="#ff5bf8">
    <style>
        :root { --bg:#ffffff; --fg:#111827; --muted:#6b7280; --card:rgba(255,91,248,.06); --line:rgba(255,91,248,.25); --accent:#ff5bf8; }
        @media (prefers-color-scheme: dark) { :root { --bg:#000000; --fg:#ffffff; --muted:#9ca3af; --card:rgba(255,255,255,.05); --line:rgba(255,91,248,.35); } }
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg);
               display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 100%; max-width: 420px; text-align: center; padding: 40px 28px; border-radius: 28px;
                background: var(--card); border: 1px solid var(--line); }
        .logo { width: 160px; max-width: 60%; height: auto; margin-bottom: 8px; }
        .icon { width: 72px; height: 72px; margin: 8px auto 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                background: var(--accent); box-shadow: 0 10px 30px rgba(255,91,248,.35); }
        .icon svg { width: 36px; height: 36px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
        p { font-size: 14px; line-height: 1.6; color: var(--muted); margin-bottom: 24px; }
        button { width: 100%; padding: 14px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; font: 600 15px inherit;
                 cursor: pointer; box-shadow: 0 8px 24px rgba(255,91,248,.3); transition: transform .15s, opacity .15s; }
        button:active { transform: scale(.98); }
        .status { margin-top: 16px; font-size: 12px; color: var(--muted); min-height: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="logo.png" alt="Comet" onerror="this.style.display='none'">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg>
        </div>
        <h1>You're offline</h1>
        <p>Comet needs an internet connection to talk to the AI. Check your Wi-Fi or mobile data, then try again.</p>
        <button id="retry">Try again</button>
        <div class="status" id="status"></div>
    </div>
    <script>
        const status = document.getElementById('status');
        const goHome = () => { location.href = './index.html'; };
        document.getElementById('retry').addEventListener('click', () => {
            if (navigator.onLine) { goHome(); }
            else { status.textContent = 'Still offline. Waiting for a connection…'; }
        });
        window.addEventListener('online', goHome);
    </script>
</body>
</html>
