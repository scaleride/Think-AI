<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | ThinkBase AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #111827;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-pink {
            background-color: #ff5bf8;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-pink:hover {
            background-color: #ff7efb;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(255, 91, 248, 0.2);
        }

        .social-btn {
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background-color: #f9fafb;
            border-color: rgba(0, 0, 0, 0.2);
        }

        .input-field {
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #ff5bf8;
            box-shadow: 0 0 0 4px rgba(255, 91, 248, 0.1);
            outline: none;
        }

        .logo-glow {
            filter: drop-shadow(0 0 10px rgba(255, 91, 248, 0.3));
        }
    </style>
</head>
<body class="flex min-h-screen items-center justify-center p-6 bg-gray-50">

    <div class="auth-card space-y-8">
        <!-- Logo -->
        <div class="flex flex-col items-center gap-4">
            <div class="w-20 h-20 rounded-full border-4 border-white shadow-2xl overflow-hidden transform hover:scale-110 transition-transform duration-300 logo-glow">
                <img src="f_logo.jpg" alt="Think AI" class="w-full h-full object-cover">
            </div>
            <div class="text-center">
                <h1 class="text-2xl font-bold tracking-tight">Welcome to Think AI</h1>
                <p class="text-sm text-gray-500 mt-1">Log in with your account to continue</p>
            </div>
        </div>

        <div class="bg-white p-10 rounded-[32px] shadow-2xl shadow-black/5 space-y-6">
            <!-- Social Login -->
            <div class="space-y-3">
                <button class="social-btn w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl text-sm font-medium text-gray-700">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </button>
                <button class="social-btn w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl text-sm font-medium text-gray-700">
                    <i data-lucide="github" class="w-5 h-5"></i>
                    GitHub
                </button>
            </div>

            <div class="relative flex items-center py-2">
                <div class="flex-grow border-t border-gray-100"></div>
                <span class="flex-shrink mx-4 text-[10px] font-bold uppercase tracking-widest text-gray-300">OR</span>
                <div class="flex-grow border-t border-gray-100"></div>
            </div>

            <!-- Email Login Form -->
            <form id="login-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Email address</label>
                    <input type="email" required placeholder="name@company.com" class="input-field w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <button type="submit" class="btn-pink w-full py-4 rounded-xl font-bold text-sm shadow-xl shadow-[#ff5bf8]/10">Continue</button>
            </form>

            <div class="text-center pt-2">
                <p class="text-sm text-gray-500">Don't have an account? <a href="#" class="text-[#ff5bf8] font-semibold hover:underline">Sign up</a></p>
            </div>
        </div>

        <div class="text-center space-x-4">
            <a href="#" class="text-xs text-gray-400 hover:text-gray-600">Terms of use</a>
            <span class="text-gray-300">|</span>
            <a href="#" class="text-xs text-gray-400 hover:text-gray-600">Privacy policy</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate successful login
            localStorage.setItem('think_ai_logged_in', 'true');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
