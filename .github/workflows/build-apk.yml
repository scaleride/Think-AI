name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize Web Assets Directory
      run: |
        mkdir www
        cp index.html script.js styles.css manifest.json sw.js www/
        cp *.png www/ || true
        cp *.jpg www/ || true
        cp *.jpeg www/ || true

    - name: Install Capacitor CLI & Android Platform
      run: |
        npm init -y
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

    - name: Initialize Capacitor Config
      run: |
        npx cap init "Think AI" "com.lyft.thinkai" --web-dir="www"

    - name: Add Android Platform
      run: |
        npx cap add android

    - name: Configure Android App Launcher Icons using Jimp
      run: |
        npm install jimp
        # Delete adaptive icons to force Android to use the pre-rendered high-quality PNGs we generate
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        
        cat << 'EOF' > resize-icons.js
        const Jimp = require('jimp');
        const fs = require('fs');
        const path = require('path');

        const sizes = [
          { path: 'mipmap-mdpi/ic_launcher.png', size: 48, round: false },
          { path: 'mipmap-hdpi/ic_launcher.png', size: 72, round: false },
          { path: 'mipmap-xhdpi/ic_launcher.png', size: 96, round: false },
          { path: 'mipmap-xxhdpi/ic_launcher.png', size: 144, round: false },
          { path: 'mipmap-xxxhdpi/ic_launcher.png', size: 192, round: false },
          
          { path: 'mipmap-mdpi/ic_launcher_round.png', size: 48, round: true },
          { path: 'mipmap-hdpi/ic_launcher_round.png', size: 72, round: true },
          { path: 'mipmap-xhdpi/ic_launcher_round.png', size: 96, round: true },
          { path: 'mipmap-xxhdpi/ic_launcher_round.png', size: 144, round: true },
          { path: 'mipmap-xxxhdpi/ic_launcher_round.png', size: 192, round: true }
        ];

        async function resize() {
          const image = await Jimp.read('ai_avatar.png');
          const resDir = path.join('android', 'app', 'src', 'main', 'res');
          
          for (const item of sizes) {
            const dest = path.join(resDir, item.path);
            const dir = path.dirname(dest);
            if (!fs.existsSync(dir)) {
              fs.mkdirSync(dir, { recursive: true });
            }
            const cloned = image.clone();
            if (item.round) {
              cloned.circle();
            }
            await cloned.resize(item.size, item.size).writeAsync(dest);
            console.log(`Generated ${dest} (${item.size}x${item.size})`);
          }
        }

        resize().catch(console.error);
        EOF
        node resize-icons.js
        rm resize-icons.js

    - name: Sync Capacitor Projects
      run: |
        npx cap sync

    - name: Build APK using Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Copy APK to root
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk ./Think_AI.apk

    - name: Commit and Push APK back to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Think_AI.apk
        git commit -m "Update compiled Think_AI.apk [skip ci]" || echo "No changes to commit"
        git push origin main
